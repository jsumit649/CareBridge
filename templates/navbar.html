{% load static %}

<header class="navbar-header">
    <div class="navbar-container">
        <a href="{% url 'home' %}" class="navbar-brand">
            <img src="{% static 'images/logo.png' %}" alt="CareBridge" class="navbar-logo">
        </a>
        <nav class="navbar-nav">
            <div class="navbar-links">
                <a href="{% url 'home' %}" class="navbar-link">Home</a>
                <div id="authenticated-links" class="navbar-auth-links hidden">
                    <a href="{% url 'patients' %}" class="navbar-link">Patients</a>
                    <a href="{% url 'doctors' %}" class="navbar-link">Doctors</a>
                    <a href="{% url 'mappings' %}" class="navbar-link">Mappings</a>
                </div>
            </div>
            <div class="navbar-user">
                <div id="authenticated-section" class="navbar-user-auth hidden">
                    <span class="navbar-username" id="username-display">User</span>
                    <button onclick="logout()" class="navbar-logout">Logout</button>
                </div>
                <div id="unauthenticated-section" class="navbar-user-unauth">
                    <a href="{% url 'login' %}" class="navbar-login">Login</a>
                    <a href="{% url 'register' %}" class="navbar-register">Register</a>
                </div>
            </div>
        </nav>
    </div>
</header>
