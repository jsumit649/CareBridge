{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Doctors</h1>
        <button id="createDoctorBtn" class="btn btn-primary">
            Create Doctor
        </button>
    </div>

    <!-- Create Doctor Form (Initially Hidden) -->
    <div id="createDoctorForm" class="form-card hidden">
        <h2 class="form-title">Create New Doctor</h2>
        <form id="doctorForm" class="form-grid">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Specialization</label>
                <input type="text" name="specialization" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">License Number</label>
                <input type="text" name="license_number" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Years of Experience</label>
                <input type="number" name="years_experience" min="0" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" required class="form-input">
            </div>
            <div class="form-group form-group-full">
                <label class="form-label">Qualifications</label>
                <textarea name="qualifications" rows="2" class="form-textarea"></textarea>
            </div>
            <div class="form-group form-group-full">
                <label class="form-label">Hospital Affiliation</label>
                <input type="text" name="hospital_affiliation" class="form-input">
            </div>
            <div class="form-group form-group-full">
                <label class="form-label">Availability</label>
                <textarea name="availability" rows="2" placeholder="e.g., Mon-Fri 9AM-5PM" class="form-textarea"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">
                    Create Doctor
                </button>
                <button type="button" id="cancelDoctorForm" class="btn btn-secondary">
                    Cancel
                </button>
            </div>
        </form>
    </div>

    <!-- Doctors List -->
    <div class="content-card">
        <h2 class="content-title">Doctors List</h2>
        <div id="doctorsList" class="cards-grid">
            <!-- Doctors will be loaded here -->
        </div>
    </div>
</div>
{% endblock content %}
