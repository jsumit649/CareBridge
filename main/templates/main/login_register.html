{% extends 'main.html' %}

{% block content %}

<div class="auth-container">
    {% if page == 'login' %}
    <div class="login-container">
        <form id="jwt-login-form" class="login-form">
            {% csrf_token %}
            <label for="login-username" class="login-label">Username</label>
            <input type="text" id="login-username" class="login-input" placeholder="Enter Username"/>
            <label for="login-password" class="login-label">Password</label>
            <input type="password" id="login-password" class="login-input" placeholder="Enter Password"/>
            <button type="submit" class="login-submit-btn">Login</button>
        </form>
        <p class="login-register-link">Haven't signed up yet? <a href="{% url 'register' %}">Sign up</a></p>
    </div>

    <script>
    document.getElementById("jwt-login-form").addEventListener("submit", async function(e) {
        e.preventDefault();
        const username = document.getElementById("login-username").value;
        const password = document.getElementById("login-password").value;

        const res = await fetch("/api/token/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
            localStorage.setItem("access", data.access);
            localStorage.setItem("refresh", data.refresh);
            window.location.href = "/";
        } else {
            alert("Login failed: " + (data.detail || JSON.stringify(data)));
        }
    });
    </script>

    {% else %}
    <div class="register-container">
        <form id="jwt-register-form" class="register-form">
            {% csrf_token %}
            <input type="text" id="register-username" placeholder="Username" required/>
            <input type="email" id="register-email" placeholder="Email" required/>
            <input type="password" id="register-password" placeholder="Password" required/>
            <button type="submit" class="register-submit-btn">Register</button>
        </form>
        <p class="register-login-link">Already signed up? <a href="{% url 'login' %}">Login</a></p>
    </div>

    <script>
    document.getElementById("jwt-register-form").addEventListener("submit", async function(e) {
        e.preventDefault();
        const username = document.getElementById("register-username").value;
        const email = document.getElementById("register-email").value;
        const password = document.getElementById("register-password").value;

        const res = await fetch("/api/register/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();
        if (res.ok) {
            alert("Registration successful — logging in...");
            // optionally auto-login using /api/token/ here
            window.location.href = "/login/";
        } else {
            alert("Registration failed: " + JSON.stringify(data));
        }
    });
    </script>
    {% endif %}
</div>

{% endblock content %}
