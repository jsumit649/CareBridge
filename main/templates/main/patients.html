{% extends "main.html" %}
{% load static %}

{% block content %}
<div class="page-container">
    <div class="page-header">
        <h1 class="page-title">Patients</h1>
        <button id="createPatientBtn" class="btn btn-primary">
            Create Patient
        </button>
    </div>

    <!-- Create Patient Form (Initially Hidden) -->
    <div id="createPatientForm" class="form-card hidden">
        <h2 class="form-title">Create New Patient</h2>
        <form id="patientForm" class="form-grid">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Date of Birth</label>
                <input type="date" name="dob" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Gender</label>
                <select name="gender" required class="form-select">
                    <option value="">Select Gender</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                    <option value="O">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Phone</label>
                <input type="tel" name="phone" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-input">
            </div>
            <div class="form-group form-group-full">
                <label class="form-label">Address</label>
                <textarea name="address" rows="2" class="form-textarea"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Blood Group</label>
                <select name="blood_group" class="form-select">
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Emergency Contact</label>
                <input type="tel" name="emergency_contact" class="form-input">
            </div>
            <div class="form-group form-group-full">
                <label class="form-label">Allergies</label>
                <textarea name="allergies" rows="2" class="form-textarea"></textarea>
            </div>
            <div class="form-group form-group-full">
                <label class="form-label">Medical History</label>
                <textarea name="medical_history" rows="3" class="form-textarea"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-success">
                    Create Patient
                </button>
                <button type="button" id="cancelPatientForm" class="btn btn-secondary">
                    Cancel
                </button>
            </div>
        </form>
    </div>

    <!-- Patients List -->
    <div class="content-card">
        <h2 class="content-title">Patient List</h2>
        <div id="patientsList" class="cards-grid">
            <p class="loading-text">Loading patients...</p>
        </div>
    </div>
</div>
{% endblock content %}
